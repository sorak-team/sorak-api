openapi: 3.0.3
info:
  title: Sorak Preschool Management System API
  version: 1.0.0
  description: >-
    Tài liệu API đầy đủ và toàn diện của **Hệ thống Quản lý Trường Mầm non Sorak
    (Capstone SEP490)**.

    Bao gồm toàn bộ **153 endpoints** thuộc 14 phân hệ nghiệp vụ và **49 Schemas
    chi tiết** (Thực thể Prisma 3NF, Request DTOs và Response Wrappers).
servers:
  - url: https://testmamnonhontre.sorak.io.vn/api
    description: 🧪 Server Test / Staging (Dành cho Tester & Mobile Dev)
  - url: https://test2mamnonhontre.sorak.io.vn/api
    description: 🧪 Server Test 2 (Môi trường Staging Test 2)
  - url: https://mamnonhontre.sorak.io.vn/api
    description: 🚀 Server Production (Hệ thống chính thức)
  - url: /api
    description: Current Server (Tự động thích ứng domain hiện tại)
  - url: http://103.69.191.210:8084/api
    description: VPS Staging Port 8084 (HTTP Trực tiếp)
  - url: http://localhost:3000/api
    description: Local Development Server
tags:
  - name: System
    description: Kiểm tra trạng thái máy chủ (Health Check & Uptime)
  - name: Auth
    description: Xác thực, đăng nhập, 2FA, OTP và quản lý phiên (Sessions)
  - name: Accounts
    description: Quản trị danh sách tài khoản người dùng và phân quyền BGH
  - name: Students
    description: Hồ sơ học sinh, tuyển sinh, chuyển lớp và liên kết phụ huynh
  - name: Classes
    description: Quản lý lớp học, phân bổ học sinh, giáo viên phụ trách và báo cáo ngày
  - name: Attendance
    description: Điểm danh buổi sáng, đón trẻ, đơn xin nghỉ và ủy quyền đưa đón
  - name: Health
    description: Hồ sơ sức khỏe định kỳ, khám chuyên khoa và chỉ số BMI/WHO
  - name: Planning
    description: Kế hoạch giáo dục, thời khóa biểu tuần, phân bổ mục tiêu và trợ lý AI
  - name: Curriculum
    description: Khung chương trình GDMN, chủ đề giáo dục và ngân hàng mục tiêu
  - name: Teachers
    description: Hồ sơ giáo viên, trình độ chuyên môn và phân công giảng dạy
  - name: School Years
    description: Quản lý năm học, học kỳ, ngày nghỉ lễ và chuyển niên khóa
  - name: Assessment
    description: Đánh giá sự phát triển của trẻ (ngày, tháng, học kỳ theo TT28/51)
  - name: Good Behavior
    description: Sổ bé ngoan, tiêu chí rèn luyện và bình bầu cờ bé ngoan
  - name: Parent
    description: Cổng thông tin phụ huynh, lịch học, đơn đưa đón và phản hồi
  - name: Upload
    description: Tải lên hình ảnh avatar, ảnh ủy quyền đưa đón lên lưu trữ MinIO
paths:
  /health:
    get:
      tags:
        - System
      summary: Kiểm tra trạng thái máy chủ (Health Check)
      description: Trả về trạng thái hoạt động và thời gian uptime của hệ thống Sorak.
      responses:
        "200":
          description: Máy chủ hoạt động bình thường
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
  /accounts:
    get:
      tags:
        - Accounts
      summary: Danh sách tài khoản người dùng
      description: Endpoint API nghiệp vụ cho chức năng **Danh sách tài khoản người
        dùng** thuộc phân hệ **Accounts**.
      security:
        - bearerAuth: []
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
          description: Số trang
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
          description: Số bản ghi mỗi trang
        - name: search
          in: query
          schema:
            type: string
          description: Từ khóa tìm kiếm
      responses:
        "200":
          description: Thao tác thành công
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
        "400":
          description: Dữ liệu không hợp lệ (Validation Error)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Chưa xác thực hoặc Token đã hết hạn
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Không đủ quyền hạn truy cập (Forbidden)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      tags:
        - Accounts
      summary: Tạo tài khoản người dùng mới
      description: Endpoint API nghiệp vụ cho chức năng **Tạo tài khoản người dùng
        mới** thuộc phân hệ **Accounts**.
      security:
