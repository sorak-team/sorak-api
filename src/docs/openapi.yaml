components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: "Nhập Access Token lấy từ API /auth/login. Ví dụ: Bearer <token>"
  schemas:
    HealthResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          type: object
          properties:
            status:
              type: string
              example: ok
            uptime:
              type: number
              example: 1250.4
    ErrorResponse:
      type: object
      properties:
        success:
          type: boolean
          example: false
        error:
          type: object
          properties:
            code:
              type: string
              example: VALIDATION_ERROR
            message:
              type: string
              example: Thông báo lỗi chi tiết từ server
            details:
              type: object
    LoginRequest:
      type: object
      required:
        - password
      properties:
        username:
          type: string
          example: CB20001
          description: Tên đăng nhập hoặc mã tài khoản
        password:
          type: string
          format: password
          example: Sorak@2026
          description: Mật khẩu
        role:
          type: string
          enum:
            - TEACHER_GV
            - PARENT_PH
            - PRINCIPAL_BGH
            - ADMIN_BGH
          example: TEACHER_GV
          description: Vai trò người dùng đăng nhập
        captchaToken:
          type: string
          example: sorak-mobile-bypass
          description: Mã xác thực bảo vệ bot Cloudflare Turnstile (Dùng
            "sorak-mobile-bypass" cho Mobile App)
        rememberMe:
          type: boolean
          default: true
    RefreshTokenRequest:
      type: object
      required:
        - refreshToken
      properties:
        refreshToken:
          type: string
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
          description: Refresh token để cấp mới access token
    LoginResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          type: object
          properties:
            accessToken:
              type: string
              example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
            refreshToken:
              type: string
              example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
            accessExpiresAt:
              type: string
              example: 2026-11-03T10:15:00Z
            sessionId:
              type: string
              example: ses_123456789
            user:
              $ref: "#/components/schemas/UserProfile"
    UserProfile:
      type: object
      properties:
        id:
          type: string
          example: CB20001
        username:
          type: string
          example: CB20001
        fullName:
          type: string
          example: Nguyễn Thị Thơ
        role:
          type: string
          example: TEACHER_GV
        email:
          type: string
          example: tho.nguyen@mamnonhontre.sorak.io.vn
        phone:
          type: string
          example: "0901234567"
    UserProfileResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          $ref: "#/components/schemas/UserProfile"
    Verify2FARequest:
      type: object
      required:
        - tempToken
        - totpCode
      properties:
        tempToken:
          type: string
          example: eyJhbGciOiJIUzI1Ni...
        totpCode:
          type: string
          example: "123456"
    ForgotPasswordRequest:
      type: object
      required:
        - email
      properties:
        email:
          type: string
          format: email
          example: admin@mamnonhontre.sorak.io.vn
