      responses:
        "200":
          description: Thao tác thành công
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
        "400":
          description: Dữ liệu không hợp lệ (Validation Error)
          content:
